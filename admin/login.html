<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceso administrativo — Consultoría Martínez</title>
<style>
:root{--p:#5b36a0;--ink:#24153f;--mut:#686574;--bg:#f3f1f8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#e8dcff,transparent 30%),var(--bg);display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{background:rgba(255,255,255,.9);border-radius:20px;padding:34px;width:100%;max-width:380px;box-shadow:0 12px 40px #24153f22}
h1{font-size:22px;margin:0 0 6px}
p.sub{color:var(--mut);font-size:13px;margin:0 0 20px}
label{font-size:12px;font-weight:bold}
input{width:100%;padding:11px;margin:5px 0 14px;border:1px solid #d8d1e3;border-radius:10px;font:inherit}
button{width:100%;border:0;border-radius:10px;padding:12px;background:var(--p);color:#fff;font-weight:bold;font:inherit;cursor:pointer}
.msg{font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:12px;display:none}
.msg.error{background:#fde8ec;color:#8a1f3a;display:block}
.msg.ok{background:#e8f7ee;color:#1c6b3e;display:block}
</style></head><body>
<div class="card">
  <h1>Acceso administrativo</h1>
  <p class="sub">Consultoría Martínez — panel de gobierno documental</p>
  <div id="msg" class="msg"></div>
  <label>Correo</label>
  <input id="email" type="email" autocomplete="username" placeholder="tu-correo@ejemplo.com">
  <label>Contraseña</label>
  <input id="password" type="password" autocomplete="current-password">
  <button id="entrar">Entrar</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-config.js"></script>
<script>
const $ = id => document.getElementById(id);
const showMsg = (text, ok) => { const m = $('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'error'); };

async function checkSession(){
  const { data } = await supabaseClient.auth.getSession();
  if (data.session) window.location.href = 'index.html';
}
checkSession();

$('entrar').onclick = async () => {
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) { showMsg('Escribe tu correo y contraseña.'); return; }
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { showMsg('No se pudo entrar: ' + error.message); return; }
  window.location.href = 'index.html';
};
</script>
</body></html>
